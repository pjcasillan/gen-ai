on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Terraform Plan"]
    types: ["completed"]

permissions:
  id-token: write
  contents: read

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::917675236035:role/github-role
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-pkg

      - name: Generate Terraform tfvars file
        run: |
          echo "region = \"${{ secrets.AWS_REGION }}\"" > terraform/terraform.tfvars
          echo "project_name = \"${{ secrets.PROJECT_NAME }}\"" >> terraform/terraform.tfvars
          echo "s3_backend_bucket = \"${{ secrets.S3_BACKEND_BUCKET }}\"" >> terraform/terraform.tfvars
          echo "backend_state_key = \"${{ secrets.BACKEND_STATE_KEY }}\"" >> terraform/terraform.tfvars

      - name: Terraform Apply
        run: terraform apply -auto-approve