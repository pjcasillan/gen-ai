name: terraform-apply

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GENAI_OIDC_ROLEARN }}
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GENAI_S3_BACKEND_BUCKET }}" \
            -backend-config="key=${{ secrets.GENAI_BACKEND_STATE_KEY }}" \
            -backend-config="region=${{ secrets.GENAI_REGION }}"

      - name: Generate Terraform tfvars file
        run: |
          echo "region = \"${{ secrets.AWS_REGION }}\"" > terraform/terraform.tfvars
          echo "project_name = \"${{ secrets.PROJECT_NAME }}\"" >> terraform/terraform.tfvars
          echo "s3_backend_bucket = \"${{ secrets.S3_BACKEND_BUCKET }}\"" >> terraform/terraform.tfvars
          echo "backend_state_key = \"${{ secrets.BACKEND_STATE_KEY }}\"" >> terraform/terraform.tfvars

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve