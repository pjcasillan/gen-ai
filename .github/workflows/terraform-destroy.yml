name: terraform-destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::917675236035:role/github-role
          aws-region: ap-southeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GENAI_S3_BACKEND_BUCKET }}" \
            -backend-config="key=${{ secrets.GENAI_BACKEND_STATE_KEY }}" \
            -backend-config="region=${{ secrets.GENAI_REGION }}"

      - name: Terraform Destroy
        working-directory: terraform
        run: terraform destroy -auto-approve