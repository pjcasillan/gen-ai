name: "Prep, Terraform Init and Validate, Terraform Plan"

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform-validate:
    # needs: prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GENAI_OIDC_ROLEARN }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GENAI_S3_BACKEND_BUCKET }}" \
            -backend-config="key=${{ secrets.GENAI_BACKEND_STATE_KEY }}" \
            -backend-config="region=${{ secrets.GENAI_REGION }}"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  terraform-plan:
    needs: terraform-validate
    runs-on: ubuntu-latest

    steps:
      # - name: Download artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: lambda-pkg
      #     path: terraform

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GENAI_OIDC_ROLEARN }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GENAI_S3_BACKEND_BUCKET }}" \
            -backend-config="key=${{ secrets.GENAI_BACKEND_STATE_KEY }}" \
            -backend-config="region=${{ secrets.GENAI_REGION }}"

      - name: Generate Terraform tfvars file
        run: |
          echo "region = \"${{ secrets.AWS_REGION }}\"" > terraform/terraform.tfvars
          echo "project_name = \"${{ secrets.PROJECT_NAME }}\"" >> terraform/terraform.tfvars

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan
          